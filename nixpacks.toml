[phases.setup]
nixPkgs = ["nodejs_20", "python311Full", "curl"]

[phases.install]
cmds = [
  "cd frontend && npm install --legacy-peer-deps && cd ..",
  "curl -sSL https://bootstrap.pypa.io/get-pip.py | python3 - --break-system-packages",
  "python3 -m pip install --break-system-packages -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build && cd ..",
  "ls -la frontend/build/index.html"
]

[start]
cmd = "cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
