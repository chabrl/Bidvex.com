[pytest]
testpaths = backend/tests
asyncio_mode = strict
# Exclude orphan QA runners that exec on import
norecursedirs = .git node_modules e2e_qa_test.py
addopts = --ignore=backend/tests/e2e_qa_test.py
markers =
    monetization: 90-second iter308+iter309 monetization-pipeline + listing-pipeline regression gate (run with `pytest -m monetization`)
