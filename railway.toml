[build]
builder = "NIXPACKS"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["nodejs_20", "yarn", "python311", "pip"]

[build.nixpacksPlan.phases.install]
cmds = [
  "cd frontend && yarn install --frozen-lockfile && cd ..",
  "pip3 install --break-system-packages -r backend/requirements.txt"
]

[build.nixpacksPlan.phases.build]
cmds = [
  "cd frontend && ./node_modules/.bin/craco build && cd ..",
  "echo 'Build complete' && ls -la frontend/build/index.html"
]

[deploy]
startCommand = "cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
