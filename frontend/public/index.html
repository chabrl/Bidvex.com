<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) — must be the first thing in <head> for Google's verifier to detect it -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-D57B90DGSQ"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-D57B90DGSQ');
        </script>

        <meta charset="utf-8" />
        <!-- iter361 CWV — Removed `maximum-scale=1` (WCAG 1.4.4 violation +
             PageSpeed accessibility flag). Users must be able to zoom. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#009BFF" />
        
        <!-- Security headers via meta -->
        <meta http-equiv="X-Content-Type-Options" content="nosniff" />
        
        <!-- Preconnect hints for CDN and third-party resources -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://cdn.mcauto-images-production.sendgrid.net" crossorigin />
        <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
        <link rel="preconnect" href="https://us-assets.i.posthog.com" />
        <link rel="dns-prefetch" href="https://js.stripe.com" />
        <!-- iter382 CLS fix — Google Fonts now loaded with `display=optional`
             instead of `display=swap`. `swap` shows the fallback font first
             then swaps to the web font once it downloads, and the metric
             difference reflows the hero (grew ~250-300 px in the previous
             CLS report, pushing everything below it and emitting the top
             layout-shift entries). `optional` uses fallback permanently if
             the font isn't cached within 100 ms — eliminates the reflow. -->
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=optional" rel="stylesheet" />

        <!-- iter358 CWV — Preload the homepage LCP hero image so it starts
             fetching BEFORE React boots. `fetchpriority="high"` forces the
             browser to move it to the top of the network queue.
             iter380 — Point the preload at the tiny WebP variant (~59KB
             vs 721KB PNG). `type="image/webp"` + `imagesrcset` mean the
             preload is only used by WebP-capable browsers; older browsers
             skip it and fall back to HeroPhone.js's <picture><img
             src=".png"> fallback so no one gets a broken image. -->
        <link rel="preload" as="image" href="/assets/hero-phone-en.webp" imagesrcset="/assets/hero-phone-en.webp" type="image/webp" fetchpriority="high" />
        <link rel="preload" as="image" href="/bidvex-icon.png" fetchpriority="high" />
        
        <meta property="og:title" content="BidVex | Online Auction Marketplace" />
        <meta property="og:description" content="Canada's bilingual auction platform. Vehicles, storage units, industrial lots. Bid now." />
        <meta property="og:image" content="%PUBLIC_URL%/bidvex-icon.png" />
        <meta property="og:url" content="https://bidvex.com" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="BidVex" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="BidVex | Online Auction Marketplace" />
        <meta name="twitter:description" content="Canada's bilingual auction platform. Vehicles, storage units, industrial lots. Bid now." />
        <meta name="twitter:image" content="%PUBLIC_URL%/bidvex-icon.png" />

        <!-- Bilingual hreflang (Canadian English + Canadian French) -->
        <link rel="alternate" hreflang="en-ca" href="https://www.bidvex.com/?lang=en" />
        <link rel="alternate" hreflang="fr-ca" href="https://www.bidvex.com/?lang=fr" />
        <link rel="alternate" hreflang="x-default" href="https://www.bidvex.com/" />
        <!-- iter339 — static canonical removed: it conflicted with the per-page
             Helmet canonical (every page appeared canonicalized to the homepage).
             Per-page canonicals are set by src/components/SEO.js. -->
        
        <!-- Favicons & App Icons -->
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/bidvex-icon.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/bidvex-icon.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="icon" href="%PUBLIC_URL%/bidvex-icon.png" />
        
        <!-- Android Chrome Icons -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=2.1" />
        <meta name="msapplication-TileColor" content="#009BFF" />
        <meta name="msapplication-TileImage" content="%PUBLIC_URL%/bidvex-icon.png" />

        <title>BidVex</title>
        
        <!-- Critical above-the-fold CSS (FIX 4) -->
        <style>
          *,*::before,*::after{box-sizing:border-box;margin:0}
          body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
          #initial-skeleton{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#eff6ff 0%,#fff 50%,#f0fdfa 100%)}
          .sk-nav{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
          .sk-pill{background:#e2e8f0;border-radius:6px;animation:shimmer 1.5s infinite}
          .sk-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
          @keyframes shimmer{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
        </style>
        
        <!-- FIX 2: Google AdSense REMOVED — BidVex does not serve ads -->

        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>

        <!-- Meta (Facebook) Pixel — runtime boot via src/utils/metaPixel.js gated on
             CASL/GDPR analytics consent. The noscript fallback below fires only
             once the user clicks "Accept All" on the cookie banner — it is
             unconditional only as a no-JS fallback per Meta's spec. -->
        <noscript><img height="1" width="1" style="display:none"
          src="https://www.facebook.com/tr?id=825987810565038&ev=PageView&noscript=1" /></noscript>
        <!-- End Meta Pixel Code -->
        <!--
        These two scripts have been added for the testing, please do not edit or remove them
        -->

        <script src="https://unpkg.com/rrweb@latest/dist/rrweb.min.js"></script>
        <script src="https://d2adkz2s9zrlge.cloudfront.net/rrweb-recorder-20250919-1.js"></script>

                document.head.appendChild(debugScript);

                // Configure Tailwind

                    corePlugins: { preflight: false },

                // Load Tailwind CDN
                var tailwindScript = document.createElement('script');
                tailwindScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(tailwindScript);
            }
        </script>

        <!-- Google tag (gtag.js) — Google Ads conversion tracking (AW-18140095337) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18140095337"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}

        </script>

        <!-- iter387 — Google AdSense integration removed. All ad-unit slots
             now render either a featured platform listing or nothing
             (see /app/frontend/src/components/FeaturedListingSlot.jsx). -->
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root">
          <!-- Inline skeleton — visible instantly while JS loads -->
          <div id="initial-skeleton">
            <!-- Navbar skeleton -->
            <div class="sk-nav">
              <div style="width:100px;height:32px" class="sk-pill"></div>
              <div style="display:flex;gap:8px">
                <div style="width:50px;height:28px" class="sk-pill"></div>
                <div style="width:70px;height:36px;background:linear-gradient(135deg,#1E3A8A,#06B6D4);border-radius:8px"></div>
              </div>
            </div>
            <!-- Hero skeleton -->
            <div class="sk-hero">
              <div style="width:280px;max-width:80%;height:40px;margin-bottom:16px" class="sk-pill" style="border-radius:8px"></div>
              <div style="width:220px;max-width:60%;height:20px;margin-bottom:32px" class="sk-pill"></div>
              <div style="display:flex;gap:12px">
                <div style="width:140px;height:44px;background:linear-gradient(135deg,#1E3A8A,#06B6D4);border-radius:999px"></div>
                <div style="width:120px;height:44px;border-radius:999px" class="sk-pill"></div>
              </div>
            </div>
          </div>
        </div>
