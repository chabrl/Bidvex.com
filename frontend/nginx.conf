# iter380 — Frontend nginx configuration for BidVex production.
#
# Purpose:
#   • Enable gzip compression for JS/CSS/JSON/text so the mobile PageSpeed
#     "Enable text compression" audit passes.
#   • Serve /static/ (CRA hashed assets) with immutable long-lived caching
#     so repeat visits pull from browser cache instead of the network.
#
# This file is picked up by the Emergent deployment pipeline. It does NOT
# change SendGrid, DNS, or the backend proxy setup.

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ─── Gzip compression ────────────────────────────────────────────
    # Only compresses text-based responses > 1 KB. `gzip_vary` adds the
    # `Vary: Accept-Encoding` header so intermediate caches don't serve
    # compressed bytes to a client that can't decode them.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/xml
        text/javascript
        text/html;

    # ─── Server block ─────────────────────────────────────────────────
    server {
        listen       3000;
        server_name  _;

        root   /app/frontend/build;
        index  index.html;

        # SPA fallback — everything that isn't a static file resolves to
        # index.html so React Router can handle client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Long-lived cache for CRA hashed assets ───────────────────
        # Every filename under /static/ carries a content hash, so we can
        # safely tell the browser to cache these for a year and treat them
        # as immutable — repeat visits skip the network entirely.
        location /static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Additional immutable caching for other hashed asset roots
        # (chunk files emitted by webpack outside /static/, plus web fonts
        # and pre-optimised WebP images added in iter380).
        location ~* \.(?:woff2?|ttf|otf|eot|webp)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # index.html itself should never be immutable — we always want the
        # browser to revalidate so a fresh deploy picks up new chunk names.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Custom 404 falls back to the SPA (client-side error page).
        error_page  404  /index.html;
    }
}
